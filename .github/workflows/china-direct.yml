name: Fontes chinesas diretas
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/china-direct.yml'
      - 'radar/china_feeds.py'
  schedule:
    # Quatro verificacoes por dia. Feeds nao representam vendas; 0 EUR.
    - cron: '25 0,6,12,18 * * *'
permissions:
  contents: write
concurrency:
  group: radar-collect
  cancel-in-progress: false
jobs:
  chinese-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.32,<3'
      - name: Recolher RSS de editoras chinesas
        run: python -m radar.china_feeds --timeout 12
      - name: Verificar noticias PT e ES dos candidatos
        run: python -m radar.market_gap --max-topics 6 --timeout 10
      - name: Proteger base e gerar painel publico
        run: |
          python -m radar.public_safety
          python -m radar.report --public
      - name: Guardar apenas dados de pesquisa e dashboard sem segredos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/radar.sqlite dashboard_offline.html
          if ! git diff --cached --quiet; then
            git commit -m 'data: atualizar fontes chinesas diretas'
            git pull --rebase origin main
            git push
          fi
