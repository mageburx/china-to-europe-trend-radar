name: Recolher sinais RSS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '15 6 * * *'  # 06:15 UTC, diariamente; GitHub pode atrasar schedules
permissions:
  contents: write
concurrency:
  group: radar-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "requests>=2.32,<3"
      - name: Descobrir novos sinais chineses
        run: python -m radar.discover --timeout 10 --max-items 15
      - name: Recolher notícias RSS
        run: python -m radar.collect --timeout 10 --max-items 12
      - name: Atualizar dashboard HTML offline
        run: python -m radar.report
      - name: Publicar dashboard HTML como artefacto descarregável
        uses: actions/upload-artifact@v4
        with:
          name: china-europe-radar-dashboard
          path: dashboard_offline.html
      - name: Guardar histórico e dashboard no repositório (MVP)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/radar.sqlite dashboard_offline.html
          if ! git diff --cached --quiet; then
            git commit -m 'data: atualizar observações RSS'
            git push
          fi
