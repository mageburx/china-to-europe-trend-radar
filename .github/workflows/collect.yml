name: Recolher sinais RSS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collect.yml'
      - 'radar/market_gap.py'
      - 'radar/candidate_discovery.py'
      - 'radar/discover.py'
      - 'config/platform_links.csv'
      - 'radar/platform_collect.py'
      - 'radar/core.py'
      - 'radar/ebay_prices.py'
  schedule:
    - cron: '15 6 * * *'  # 06:15 UTC, diariamente; GitHub pode atrasar schedules
permissions:
  contents: write
concurrency:
  group: radar-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "requests>=2.32,<3"
      - name: Recolher RSS diretos de editoras chinesas
        run: python -m radar.china_feeds --timeout 12
      - name: Descobrir novos sinais chineses
        run: python -m radar.discover --timeout 10 --max-items 15
      - name: Extrair candidatos dos artigos chineses
        run: python -m radar.candidate_discovery
      - name: Comparar pistas chinesas com imprensa PT e ES
        run: python -m radar.market_gap --max-topics 6 --max-items 10 --timeout 10
      - name: Recolher metadados de links públicos chineses
        run: python -m radar.platform_collect --timeout 10
      - name: Recolher notícias RSS
        run: python -m radar.collect --timeout 10 --max-items 12
      - name: Comparar preços de anúncios públicos no eBay Espanha (API gratuita opcional)
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python -m radar.ebay_prices --max-products 8 --max-items 10
      - name: Limpar registos financeiros no SQLite público
        run: python -m radar.public_safety
      - name: Atualizar dashboard HTML público
        run: python -m radar.report --public
      - name: Guardar histórico e dashboard no repositório (MVP)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/radar.sqlite dashboard_offline.html
          if ! git diff --cached --quiet; then
            git commit -m 'data: atualizar observações RSS'
            git push
          fi
